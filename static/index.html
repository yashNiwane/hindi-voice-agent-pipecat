<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Hindi Voice Calling Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --primary-accent: #238636;
            --primary-hover: #2ea043;
            --danger: #da3633;
            --danger-hover: #f85149;
            --text-main: #f0f6fc;
            --text-dim: #8b949e;
            --pulse-color: rgba(35, 134, 54, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 560px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 16px 36px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(56, 139, 253, 0.15);
            color: #58a6ff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 28px;
        }

        .visualizer-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
        }

        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--pulse-color);
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.3s ease;
        }

        .calling .pulse-ring {
            animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pulse {
            0% { transform: scale(0.85); opacity: 0.8; }
            70% { transform: scale(1.35); opacity: 0; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        .status-orb {
            width: 90px;
            height: 90px;
            background: #21262d;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .calling .status-orb {
            background: #238636;
            border-color: #2ea043;
            box-shadow: 0 0 20px rgba(35, 134, 54, 0.6);
        }

        .status-orb svg {
            width: 36px;
            height: 36px;
            fill: #c9d1d9;
            transition: all 0.3s ease;
        }

        .calling .status-orb svg {
            fill: #ffffff;
        }

        .status-text {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8b949e;
        }

        .status-dot.active {
            background: #3fb950;
            box-shadow: 0 0 8px #3fb950;
        }

        .btn {
            border: none;
            outline: none;
            padding: 14px 36px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-start {
            background: var(--primary-accent);
            color: #ffffff;
        }

        .btn-start:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-stop {
            background: var(--danger);
            color: #ffffff;
            display: none;
        }

        .btn-stop:hover {
            background: var(--danger-hover);
            transform: translateY(-1px);
        }

        .specs-grid {
            margin-top: 32px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            text-align: left;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .spec-item {
            background: #0d1117;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .spec-label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 600;
        }

        .spec-value {
            font-size: 13px;
            color: #c9d1d9;
            margin-top: 2px;
            font-weight: 500;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Pipecat + WebRTC + T4 GPU</span>
        <h1>Hindi Voice Assistant</h1>
        <p class="subtitle">Real-Time Telecalling Agent (Qwen3-ASR &bull; Gemma 4 &bull; MMS-TTS)</p>

        <div class="visualizer-wrapper" id="visWrapper">
            <div class="pulse-ring"></div>
            <div class="status-orb">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </div>
        </div>

        <div class="status-text">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusLabel">Ready to Connect</span>
        </div>

        <button class="btn btn-start" id="startBtn" onclick="startCall()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            Start Hindi Call
        </button>

        <button class="btn btn-stop" id="stopBtn" onclick="endCall()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z"/></svg>
            End Call
        </button>

        <div class="specs-grid">
            <div class="spec-item">
                <div class="spec-label">ASR Model</div>
                <div class="spec-value">Qwen3-ASR 0.6B / 1.7B</div>
            </div>
            <div class="spec-item">
                <div class="spec-label">LLM (GGUF Q4)</div>
                <div class="spec-value">Gemma 4 E2B Q4_0</div>
            </div>
            <div class="spec-item">
                <div class="spec-label">TTS Voice</div>
                <div class="spec-value">MMS-TTS-Hindi (16kHz)</div>
            </div>
            <div class="spec-item">
                <div class="spec-label">Audio Transport</div>
                <div class="spec-value">WebRTC SmallTransport</div>
            </div>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script>
        let pc = null;
        let localStream = null;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const visWrapper = document.getElementById('visWrapper');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const remoteAudio = document.getElementById('remoteAudio');

        async function startCall() {
            try {
                statusLabel.innerText = "Requesting microphone access...";
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 16000
                    }
                });

                statusLabel.innerText = "Connecting WebRTC to Kaggle server...";

                pc = new RTCPeerConnection({
                    iceServers: [
                        { urls: "stun:stun.l.google.com:19302" },
                        { urls: "stun:stun1.l.google.com:19302" }
                    ]
                });

                // Attach microphone tracks
                localStream.getAudioTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });

                // Listen for incoming audio stream from Pipecat
                pc.ontrack = (event) => {
                    if (event.streams && event.streams[0]) {
                        remoteAudio.srcObject = event.streams[0];
                    }
                };

                pc.oniceconnectionstatechange = () => {
                    console.log("ICE Connection State:", pc.iceConnectionState);
                    if (pc.iceConnectionState === 'connected') {
                        statusLabel.innerText = "Connected | Bolna shuru kijiye (Hindi)";
                        statusDot.classList.add('active');
                        visWrapper.classList.add('calling');
                    } else if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'closed') {
                        endCall();
                    }
                };

                // Create Offer
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // Wait for ICE candidates gathering to finish
                await new Promise((resolve) => {
                    if (pc.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        const checkState = () => {
                            if (pc.iceGatheringState === 'complete') {
                                pc.removeEventListener('icegatheringstatechange', checkState);
                                resolve();
                            }
                        };
                        pc.addEventListener('icegatheringstatechange', checkState);
                    }
                });

                // Send SDP Offer to Pipecat /api/offer
                const response = await fetch('/api/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type
                    })
                });

                if (!response.ok) {
                    throw new Error("Offer failed: " + response.statusText);
                }

                const answer = await response.json();
                await pc.setRemoteDescription(new RTCSessionDescription({
                    sdp: answer.sdp,
                    type: answer.type
                }));

                startBtn.style.display = 'none';
                stopBtn.style.display = 'flex';

            } catch (err) {
                console.error("Connection error:", err);
                statusLabel.innerText = "Error: " + err.message;
                endCall();
            }
        }

        function endCall() {
            if (pc) {
                pc.close();
                pc = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            statusLabel.innerText = "Call ended";
            statusDot.classList.remove('active');
            visWrapper.classList.remove('calling');
            startBtn.style.display = 'flex';
            stopBtn.style.display = 'none';
        }
    </script>
</body>
</html>
